name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build exe
        run: npm run dist

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-starter-windows
          path: dist/*.exe
